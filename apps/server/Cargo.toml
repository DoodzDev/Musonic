[package]
name = "musonic-server"
description = "Musonic Server: music library server, Subsonic-compatible, with a native API and pluggable audio providers"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license-file = "LICENSE"
authors = ["DoodzProg"]
repository = "https://github.com/DoodzProg/Musonic"
publish = false

[lib]
name = "musonic_server"
path = "src/lib.rs"

[[bin]]
name = "musonic-server"
path = "src/main.rs"

[dependencies]
anyhow = "1"
async-trait = "0.1"
axum = "0.8"
bytes = "1"
futures-util = "0.3"
lofty = "0.22"
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
strsim = "0.11"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "signal", "fs", "io-util"] }
toml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
unicode-normalization = "0.1"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
