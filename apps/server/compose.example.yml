# Musonic Server with Docker Compose (also attached to each release as compose.yml).
# Copy next to your data, adjust the paths, then:
#   docker compose up -d
#   docker compose exec musonic-server musonic-server user add <name> --admin
services:
  musonic-server:
    image: ghcr.io/doodzdev/musonic-server:1   # x86 and ARM; updates within 1.x
    # Or built from source, from this folder of the repository:
    # build:
    #   context: ../..
    #   dockerfile: apps/server/Dockerfile
    container_name: musonic-server
    restart: unless-stopped
    user: "1000:1000"            # the owner of your music and data folders
    ports:
      - "127.0.0.1:4533:4533"    # put a reverse proxy (HTTPS) in front
    volumes:
      - ./data:/data             # database, caches, daily backups
      - /path/to/music:/music    # read-only (:ro) if you do not want imports
      # The machine's traffic on the console's « Données » page (else only the server's).
      - /proc/1/net/dev:/host/net/dev:ro
    environment:
      RUST_LOG: info
      # MUSONIC_ONLINE: "false"  # no online catalog
    mem_limit: 512m
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
