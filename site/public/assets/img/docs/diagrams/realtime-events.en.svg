<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" role="img" aria-labelledby="t d">
<title id="t">Real-time sync</title>
<desc id="d">The phone likes a song; the server writes it to SQLite and its event bus sends a likes event to every device of the same account; the phone ignores its own echo.</desc>
<defs><marker id="ahg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0.8 L10 5 L0 9.2 Z" fill="#7D7B77"/></marker><marker id="aho" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0.8 L10 5 L0 9.2 Z" fill="#FF6B35"/></marker><marker id="asg" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M10 0.8 L0 5 L10 9.2 Z" fill="#7D7B77"/></marker><marker id="aso" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M10 0.8 L0 5 L10 9.2 Z" fill="#FF6B35"/></marker></defs>
<rect x="20" y="100" width="180" height="150" rx="12" fill="#1C1C1E" stroke="#3A3A3D" stroke-width="1.5"/>
<g transform="translate(40 120) scale(1.25)" fill="none" stroke="#B1AFAB" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"><rect x="7" y="2.5" width="10" height="19" rx="2.2"/><path d="M11 18.5h2"/></g>
<text x="40" y="188.04" font-family="Inter Variable, Inter, system-ui, sans-serif" font-size="18" fill="#F1F0EE" text-anchor="start" font-weight="600">Phone</text>
<text x="40" y="207.75" font-family="JetBrains Mono, ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" fill="#B1AFAB" text-anchor="start">device: phone</text>
<rect x="340" y="60" width="260" height="230" rx="12" fill="#1C1C1E" stroke="#FF6B35" stroke-width="1.5"/>
<text x="470" y="94" font-family="Inter Variable, Inter, system-ui, sans-serif" font-size="18" fill="#F1F0EE" text-anchor="middle" font-weight="600">Musonic Server</text>
<rect x="360" y="180" width="220" height="54" rx="12" fill="#1C1C1E" stroke="#3A3A3D" stroke-width="1.5"/>
<text x="470" y="211.2" font-family="Inter Variable, Inter, system-ui, sans-serif" font-size="15" fill="#F1F0EE" text-anchor="middle" font-weight="600">event bus (512)</text>
<path d="M200 140 L470 140 L470 174" fill="none" stroke="#FF6B35" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#aho)"/>
<text x="270" y="130" font-family="JetBrains Mono, ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" fill="#B1AFAB" text-anchor="middle">star?id=…</text>
<text x="270" y="160" font-family="Inter Variable, Inter, system-ui, sans-serif" font-size="12.5" fill="#7D7B77" text-anchor="middle">like a song</text>
<path d="M360 214 L206 214" fill="none" stroke="#7D7B77" stroke-width="1.5" stroke-linejoin="round" stroke-dasharray="6 5" marker-end="url(#ahg)"/>
<text x="270" y="236" font-family="Inter Variable, Inter, system-ui, sans-serif" font-size="12.5" fill="#7D7B77" text-anchor="middle">own echo: ignored</text>
<path d="M470 290 L470 330" fill="none" stroke="#7D7B77" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#ahg)"/>
<text x="482" y="316" font-family="Inter Variable, Inter, system-ui, sans-serif" font-size="12.5" fill="#7D7B77" text-anchor="start">write</text>
<rect x="400" y="336" width="140" height="50" rx="12" fill="#1C1C1E" stroke="#3A3A3D" stroke-width="1.5"/>
<g transform="translate(416 349) scale(0.916667)" fill="none" stroke="#B1AFAB" stroke-width="1.63636" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="6" rx="8" ry="2.8"/><path d="M4 6v12c0 1.5 3.6 2.8 8 2.8s8-1.3 8-2.8V6"/><path d="M4 12c0 1.5 3.6 2.8 8 2.8s8-1.3 8-2.8"/></g>
<text x="448" y="366" font-family="Inter Variable, Inter, system-ui, sans-serif" font-size="15" fill="#F1F0EE" text-anchor="start" font-weight="600">SQLite</text>
