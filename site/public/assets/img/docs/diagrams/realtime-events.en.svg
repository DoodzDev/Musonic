<path d="M580 207 L764 100" fill="none" stroke="#FF6B35" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#aho)"/>
<text x="690" y="78" font-family="JetBrains Mono, ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" fill="#B1AFAB" text-anchor="middle"><tspan x="690" dy="0">{"type":"likes",</tspan><tspan x="690" dy="15">"by":"phone"}</tspan></text>
<rect x="770" y="210" width="170" height="80" rx="12" fill="#1C1C1E" stroke="#3A3A3D" stroke-width="1.5"/>
<g transform="translate(786 236) scale(1.16667)" fill="none" stroke="#B1AFAB" stroke-width="1.28571" stroke-linecap="round" stroke-linejoin="round"><rect x="4.5" y="5" width="15" height="10" rx="1.5"/><path d="M2 18.5h20"/></g>
<text x="828" y="254.48" font-family="Inter Variable, Inter, system-ui, sans-serif" font-size="16" fill="#F1F0EE" text-anchor="start" font-weight="600">Tablet</text>
<path d="M580 207 L764 250" fill="none" stroke="#FF6B35" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#aho)"/>
<text x="690" y="280" font-family="JetBrains Mono, ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" fill="#B1AFAB" text-anchor="middle"><tspan x="690" dy="0">{"type":"likes",</tspan><tspan x="690" dy="15">"by":"phone"}</tspan></text>
<rect x="20" y="404" width="920" height="52" rx="12" fill="none" stroke="#3A3A3D" stroke-width="1.5"/>
<text x="480" y="425" font-family="Inter Variable, Inter, system-ui, sans-serif" font-size="13" fill="#B1AFAB" text-anchor="middle"><tspan x="480" dy="0">Same account only. Events are not stored: up to 512 wait in memory, and a device too slow to keep up gets resync and</tspan><tspan x="480" dy="17">reloads.</tspan></text>
</svg>
