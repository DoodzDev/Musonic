<title id="t">Who Musonic talks to</title>
<desc id="d">Your Musonic Server talks to the apps and, for limited purposes, to Deezer's public API, GitHub, podcast directories and hosts, Podcast Index and YouTube Data API; the apps contact LRCLIB, and the Android app also Deezer and GitHub. Your music files never leave the server.</desc>
