<title id="t">Podcasts through the server</title>
<desc id="d">The apps talk only to Musonic Server, which searches the iTunes directory and Podcast Index, reads followed feeds every hour and relays episode audio and pictures; the database keeps shows, episodes, follows and positions.</desc>
