<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 450" role="img" aria-labelledby="t d">
<title id="t">Organiser son dossier de musique</title>
<desc id="d">Un dossier de musique avec un dossier par artiste de l'album (Daft Punk) et un par album (Discovery), qui contient cover.jpg, les fichiers audio et un fichier de paroles .lrc ; un dossier Musonic reçoit les titres importés par le serveur. Les tags de chaque fichier décident du titre, de l'artiste et de l'album ; cover.jpg devient la pochette de l'album ; un fichier .lrc du même nom qu'un titre donne ses paroles synchronisées.</desc>
<defs><marker id="ahg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0.8 L10 5 L0 9.2 Z" fill="#7D7B77"/></marker><marker id="aho" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0.8 L10 5 L0 9.2 Z" fill="#FF6B35"/></marker><marker id="asg" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M10 0.8 L0 5 L10 9.2 Z" fill="#7D7B77"/></marker><marker id="aso" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M10 0.8 L0 5 L10 9.2 Z" fill="#FF6B35"/></marker></defs>
<rect x="20" y="20" width="420" height="410" rx="12" fill="#1C1C1E" stroke="#3A3A3D" stroke-width="1.5"/>
<g transform="translate(40 38) scale(1)" fill="none" stroke="#B1AFAB" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6.5a1.5 1.5 0 0 1 1.5-1.5h4.2l2 2.2h8.8A1.5 1.5 0 0 1 21 8.7v9.8a1.5 1.5 0 0 1-1.5 1.5h-15A1.5 1.5 0 0 1 3 18.5z"/></g>
