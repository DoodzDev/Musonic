<text x="76" y="152" font-family="JetBrains Mono, ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" fill="#F1F0EE" text-anchor="start" font-weight="600">Discovery/</text>
<text x="106" y="202" font-family="JetBrains Mono, ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" fill="#B1AFAB" text-anchor="start">cover.jpg</text>
