<path d="M331.9 249 L486 249" fill="none" stroke="#7D7B77" stroke-width="1.2" stroke-linejoin="round"/>
<circle cx="331.9" cy="249" r="2.5" fill="#7D7B77"/>
<text x="500" y="246" font-family="Inter Variable, Inter, system-ui, sans-serif" font-size="15" fill="#F1F0EE" text-anchor="start" font-weight="600">Les tags de chaque fichier décident</text>
<text x="500" y="266" font-family="Inter Variable, Inter, system-ui, sans-serif" font-size="12.5" fill="#B1AFAB" text-anchor="start">titre, artiste et album (pas les noms de dossiers)</text>
<path d="M322.6 301 L486 301" fill="none" stroke="#7D7B77" stroke-width="1.2" stroke-linejoin="round"/>
<circle cx="322.6" cy="301" r="2.5" fill="#7D7B77"/>
<text x="500" y="298" font-family="Inter Variable, Inter, system-ui, sans-serif" font-size="15" fill="#F1F0EE" text-anchor="start" font-weight="600">Paroles synchronisées</text>
<text x="500" y="318" font-family="Inter Variable, Inter, system-ui, sans-serif" font-size="12.5" fill="#B1AFAB" text-anchor="start">même nom que le titre, juste à côté</text>
</svg>
