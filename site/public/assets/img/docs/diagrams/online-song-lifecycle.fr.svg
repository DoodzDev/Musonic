<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 370" role="img" aria-labelledby="t d">
<title id="t">La vie d'un titre en ligne</title>
<desc id="d">1. Trouvé en ligne dans la recherche : parcourir n'enregistre rien. 2. Liké ou ajouté à une playlist : il rejoint votre bibliothèque sans fichier, sous un seul identifiant. 3. Ensuite, avec un fournisseur qui permet l'import, il est importé comme fichier dans Musonic/Artiste de l'album/Album/ de votre dossier de musique, likes et playlists restent ; sans fournisseur, il reste un titre en ligne et se lit en extraits de 30 secondes.</desc>
<defs><marker id="ahg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0.8 L10 5 L0 9.2 Z" fill="#7D7B77"/></marker><marker id="aho" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0.8 L10 5 L0 9.2 Z" fill="#FF6B35"/></marker><marker id="asg" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M10 0.8 L0 5 L10 9.2 Z" fill="#7D7B77"/></marker><marker id="aso" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M10 0.8 L0 5 L10 9.2 Z" fill="#FF6B35"/></marker></defs>
<rect x="20" y="100" width="210" height="170" rx="12" fill="#1C1C1E" stroke="#3A3A3D" stroke-width="1.5"/>
<circle cx="50" cy="130" r="13" fill="none" stroke="#7D7B77" stroke-width="1.5"/>
<text x="50" y="135" font-family="Inter Variable, Inter, system-ui, sans-serif" font-size="13" fill="#B1AFAB" text-anchor="middle" font-weight="600">1</text>
<text x="38" y="176" font-family="Inter Variable, Inter, system-ui, sans-serif" font-size="17" fill="#F1F0EE" text-anchor="start" font-weight="600">Trouvé en ligne</text>
<text x="38" y="198" font-family="Inter Variable, Inter, system-ui, sans-serif" font-size="13" fill="#B1AFAB" text-anchor="start"><tspan x="38" dy="0">dans la recherche ;</tspan><tspan x="38" dy="17">parcourir n'enregistre</tspan><tspan x="38" dy="17">rien</tspan></text>
<path d="M230 185 L262 185" fill="none" stroke="#7D7B77" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#ahg)"/>
<rect x="268" y="100" width="250" height="170" rx="12" fill="#1C1C1E" stroke="#3A3A3D" stroke-width="1.5"/>
<circle cx="298" cy="130" r="13" fill="none" stroke="#7D7B77" stroke-width="1.5"/>
<text x="298" y="135" font-family="Inter Variable, Inter, system-ui, sans-serif" font-size="13" fill="#B1AFAB" text-anchor="middle" font-weight="600">2</text>
<text x="286" y="176" font-family="Inter Variable, Inter, system-ui, sans-serif" font-size="17" fill="#F1F0EE" text-anchor="start" font-weight="600"><tspan x="286" dy="0">Liké ou ajouté à une</tspan><tspan x="286" dy="22">playlist</tspan></text>
<text x="286" y="220" font-family="Inter Variable, Inter, system-ui, sans-serif" font-size="13" fill="#B1AFAB" text-anchor="start"><tspan x="286" dy="0">rejoint votre bibliothèque</tspan><tspan x="286" dy="17">sans fichier, sous un seul</tspan><tspan x="286" dy="17">identifiant</tspan></text>
<path d="M518 185 L548 185" fill="none" stroke="#7D7B77" stroke-width="1.5" stroke-linejoin="round"/>
<path d="M548 185 L548 97 L594 97" fill="none" stroke="#7D7B77" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#ahg)"/>
<path d="M548 185 L548 273 L594 273" fill="none" stroke="#7D7B77" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#ahg)"/>
<circle cx="548" cy="185" r="3.5" fill="#7D7B77"/>
<rect x="600" y="20" width="340" height="155" rx="12" fill="#1C1C1E" stroke="#3A3A3D" stroke-width="1.5"/>
<text x="618" y="44" font-family="Inter Variable, Inter, system-ui, sans-serif" font-size="13" fill="#B1AFAB" text-anchor="start">Avec un fournisseur qui permet l'import</text>
<text x="618" y="70" font-family="Inter Variable, Inter, system-ui, sans-serif" font-size="17" fill="#F1F0EE" text-anchor="start" font-weight="600">Importé comme fichier</text>
<text x="618" y="92" font-family="Inter Variable, Inter, system-ui, sans-serif" font-size="13" fill="#B1AFAB" text-anchor="start">dans votre dossier de musique :</text>
<text x="618" y="111" font-family="JetBrains Mono, ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#B1AFAB" text-anchor="start">Musonic/Artiste de l'album/Album/</text>
<text x="618" y="133" font-family="Inter Variable, Inter, system-ui, sans-serif" font-size="12.5" fill="#7D7B77" text-anchor="start">likes et playlists restent sur le titre</text>
<rect x="600" y="195" width="340" height="155" rx="12" fill="#1C1C1E" stroke="#3A3A3D" stroke-width="1.5"/>
<text x="618" y="232" font-family="Inter Variable, Inter, system-ui, sans-serif" font-size="13" fill="#B1AFAB" text-anchor="start">Sans fournisseur (serveur tel que publié)</text>
<text x="618" y="268" font-family="Inter Variable, Inter, system-ui, sans-serif" font-size="17" fill="#F1F0EE" text-anchor="start" font-weight="600">Reste un titre en ligne</text>
<text x="618" y="290" font-family="Inter Variable, Inter, system-ui, sans-serif" font-size="13" fill="#B1AFAB" text-anchor="start"><tspan x="618" dy="0">se lit en extraits de 30 secondes, jamais</tspan><tspan x="618" dy="17">importé</tspan></text>
</svg>
