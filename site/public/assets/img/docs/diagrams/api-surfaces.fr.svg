<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 450" role="img" aria-labelledby="t d">
<title id="t">Qui utilise quelle partie de l'API</title>
<desc id="d">Musonic Server répond sur /rest (Subsonic et OpenSubsonic), /v1 (l'API Musonic), /v1/events (événements en temps réel par WebSocket) et /health (test de vie). Les applis Musonic (Android, Musonic Web) utilisent /rest, /v1 et /v1/events ; les autres applis Subsonic utilisent /rest ; la console d'administration utilise les routes /v1 ; les scripts et tests de santé peuvent utiliser /rest, /v1 et /health. Le serveur sert aussi la console sur / et Musonic Web sur /app/.</desc>
