<title id="t">À qui parle Musonic</title>
<desc id="d">Votre Musonic Server parle aux applis et, pour des usages limités, à l'API publique de Deezer, à GitHub, aux annuaires et hébergeurs de podcasts, à Podcast Index et à l'API YouTube Data ; les applis contactent LRCLIB, et l'appli Android aussi Deezer et GitHub. Vos fichiers de musique ne quittent jamais le serveur.</desc>
