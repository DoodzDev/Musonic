<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 356" role="img" aria-labelledby="t d">
<title id="t">Life of an online song</title>
<desc id="d">An online song is found in search, becomes a library song without a file when liked or added to a playlist, is imported by an audio provider, then scanned: the file joins the same song.</desc>
<defs><marker id="ahg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0.8 L10 5 L0 9.2 Z" fill="#7D7B77"/></marker><marker id="aho" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0.8 L10 5 L0 9.2 Z" fill="#FF6B35"/></marker><marker id="asg" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M10 0.8 L0 5 L10 9.2 Z" fill="#7D7B77"/></marker><marker id="aso" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M10 0.8 L0 5 L10 9.2 Z" fill="#FF6B35"/></marker></defs>
<rect x="20" y="20" width="210" height="200" rx="12" fill="#1C1C1E" stroke="#3A3A3D" stroke-width="1.5"/>
<circle cx="50" cy="48" r="14" fill="none" stroke="#3A3A3D" stroke-width="1.5"/>
<text x="50" y="53" font-family="Inter Variable, Inter, system-ui, sans-serif" font-size="14" fill="#B1AFAB" text-anchor="middle" font-weight="600">1</text>
<text x="36" y="96.48" font-family="Inter Variable, Inter, system-ui, sans-serif" font-size="16" fill="#F1F0EE" text-anchor="start" font-weight="600">Found in search</text>
<text x="36" y="116.92" font-family="Inter Variable, Inter, system-ui, sans-serif" font-size="14" fill="#B1AFAB" text-anchor="start">online, nothing stored</text>
<path d="M230 115 L254 115" fill="none" stroke="#FF6B35" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#aho)"/>
<rect x="260" y="20" width="210" height="200" rx="12" fill="#1C1C1E" stroke="#3A3A3D" stroke-width="1.5"/>
<circle cx="290" cy="48" r="14" fill="none" stroke="#3A3A3D" stroke-width="1.5"/>
<text x="290" y="53" font-family="Inter Variable, Inter, system-ui, sans-serif" font-size="14" fill="#B1AFAB" text-anchor="middle" font-weight="600">2</text>
<text x="276" y="96.48" font-family="Inter Variable, Inter, system-ui, sans-serif" font-size="16" fill="#F1F0EE" text-anchor="start" font-weight="600"><tspan x="276" dy="0">Liked / added to a</tspan><tspan x="276" dy="21">playlist</tspan></text>
<text x="276" y="137.92" font-family="Inter Variable, Inter, system-ui, sans-serif" font-size="14" fill="#B1AFAB" text-anchor="start"><tspan x="276" dy="0">library song without a</tspan><tspan x="276" dy="18">file, one id</tspan></text>
<path d="M470 115 L494 115" fill="none" stroke="#FF6B35" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#aho)"/>
<rect x="500" y="20" width="210" height="200" rx="12" fill="#1C1C1E" stroke="#3A3A3D" stroke-width="1.5"/>
<circle cx="530" cy="48" r="14" fill="none" stroke="#3A3A3D" stroke-width="1.5"/>
<text x="530" y="53" font-family="Inter Variable, Inter, system-ui, sans-serif" font-size="14" fill="#B1AFAB" text-anchor="middle" font-weight="600">3</text>
<text x="516" y="96" font-family="Inter Variable, Inter, system-ui, sans-serif" font-size="16" fill="#F1F0EE" text-anchor="start" font-weight="600"><tspan x="516" dy="0">Imported by an</tspan><tspan x="516" dy="21">audio provider</tspan></text>
<text x="516" y="143" font-family="JetBrains Mono, ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" fill="#B1AFAB" text-anchor="start"><tspan x="516" dy="0">→ Musonic/</tspan><tspan x="516" dy="18">Album artist/Album/</tspan></text>
<path d="M710 115 L734 115" fill="none" stroke="#FF6B35" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#aho)"/>
<rect x="740" y="20" width="210" height="200" rx="12" fill="#1C1C1E" stroke="#3A3A3D" stroke-width="1.5"/>
<circle cx="770" cy="48" r="14" fill="none" stroke="#3A3A3D" stroke-width="1.5"/>
<text x="770" y="53" font-family="Inter Variable, Inter, system-ui, sans-serif" font-size="14" fill="#B1AFAB" text-anchor="middle" font-weight="600">4</text>
<text x="756" y="96.48" font-family="Inter Variable, Inter, system-ui, sans-serif" font-size="16" fill="#F1F0EE" text-anchor="start" font-weight="600">Scanned</text>
<text x="756" y="116.92" font-family="Inter Variable, Inter, system-ui, sans-serif" font-size="14" fill="#B1AFAB" text-anchor="start"><tspan x="756" dy="0">the file joins the</tspan><tspan x="756" dy="18">same song; likes and</tspan><tspan x="756" dy="18">playlists unchanged</tspan></text>
<path d="M300 220 L300 264" fill="none" stroke="#7D7B77" stroke-width="1.5" stroke-linejoin="round" stroke-dasharray="6 5" marker-end="url(#ahg)"/>
<rect x="200" y="270" width="360" height="64" rx="12" fill="none" stroke="#3A3A3D" stroke-width="1.5" stroke-dasharray="6 5"/>
<text x="380" y="305.92" font-family="Inter Variable, Inter, system-ui, sans-serif" font-size="14" fill="#F1F0EE" text-anchor="middle">No provider: plays as a 30-second preview</text>
</svg>
