<title id="t">Architecture overview</title>
<desc id="d">The Android app, Musonic Web, the console and other Subsonic clients reach Musonic Server through an HTTPS reverse proxy; the server uses the music folder, SQLite, ffmpeg, the online catalogue and audio providers.</desc>
