<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" role="img" aria-labelledby="t d">
<title id="t">Architecture overview</title>
<desc id="d">On the left, the clients: the Android app (React Native, with a native Media3 player), Musonic Web and the admin console (React and Vite), which share packages/core, and other Subsonic apps. They reach Musonic Server (Rust) over HTTPS; the server answers the Subsonic API on /rest, the Musonic API on /v1 and /v1/events, and serves the console and Musonic Web. On the right, what the server uses: the music folder, SQLite, ffmpeg, the online catalogue and the audio providers.</desc>
