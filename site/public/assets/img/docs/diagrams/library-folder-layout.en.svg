<circle cx="331.9" cy="249" r="2.5" fill="#7D7B77"/>
<text x="500" y="246" font-family="Inter Variable, Inter, system-ui, sans-serif" font-size="15" fill="#F1F0EE" text-anchor="start" font-weight="600">Tags inside each file decide</text>
<text x="500" y="266" font-family="Inter Variable, Inter, system-ui, sans-serif" font-size="12.5" fill="#B1AFAB" text-anchor="start">title, artist and album (not the folder names)</text>
<path d="M322.6 301 L486 301" fill="none" stroke="#7D7B77" stroke-width="1.2" stroke-linejoin="round"/>
<circle cx="322.6" cy="301" r="2.5" fill="#7D7B77"/>
<text x="500" y="298" font-family="Inter Variable, Inter, system-ui, sans-serif" font-size="15" fill="#F1F0EE" text-anchor="start" font-weight="600">Synced lyrics</text>
<text x="500" y="318" font-family="Inter Variable, Inter, system-ui, sans-serif" font-size="12.5" fill="#B1AFAB" text-anchor="start">same name as the song, right next to it</text>
