<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 380" role="img" aria-labelledby="t d">
<title id="t">HTTPS devant le serveur</title>
<desc id="d">Les appareils joignent le serveur en HTTPS par un reverse proxy ou un tunnel sur la machine du serveur, qui passe les requêtes en HTTP simple à Musonic Server en 127.0.0.1:4533 ; le port 4533 n'est jamais ouvert.</desc>
