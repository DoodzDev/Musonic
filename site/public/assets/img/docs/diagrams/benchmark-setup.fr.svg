<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 492" role="img" aria-labelledby="t d" font-family="Inter Variable, Inter, system-ui, sans-serif" lang="fr">
<title id="t">Dispositif du banc d’essai</title>
<desc id="d">Sur un serveur virtuel ARM à 2 cœurs, 12 Go, Ubuntu 24.04, le script de test (serverbench.py, Python) parle en HTTP sur 127.0.0.1, par l’API Subsonic, à un seul serveur testé à la fois, Musonic Server 1.0.1 ou Navidrome 0.64.2, et lit leur mémoire et leur temps processeur dans /proc. Les deux lisent le même dossier de musique (1 871 fichiers, 7,0 Go, lecture seule) et utilisent le même binaire ffmpeg n8.1 ; chaque passe part d’un dossier de données vide. Passe 1 : Musonic puis Navidrome ; passe 2 : Navidrome puis Musonic ; passe 3 : Musonic puis Navidrome. Résultat = médiane des 3 passes.</desc>
