<rect x="90" y="206" width="600" height="70" rx="12" fill="#1C1C1E" stroke="#3A3A3D" stroke-width="1.5"/>
<circle cx="122" cy="241.0" r="14" fill="none" stroke="#3A3A3D" stroke-width="1.5"/>
<text x="122" y="246" font-family="Inter Variable, Inter, system-ui, sans-serif" font-size="14" fill="#B1AFAB" text-anchor="middle" font-weight="600">2</text>
<text x="158" y="246.04" font-family="Inter Variable, Inter, system-ui, sans-serif" font-size="18" fill="#F1F0EE" text-anchor="start" font-weight="600">Fichier de configuration (MUSONIC_CONFIG)</text>
