<text x="182" y="73" font-family="Inter Variable, Inter, system-ui, sans-serif" font-size="14" fill="#B1AFAB" text-anchor="middle" font-weight="600">4</text>
<text x="218" y="63.79" font-family="Inter Variable, Inter, system-ui, sans-serif" font-size="18" fill="#F1F0EE" text-anchor="start" font-weight="600">Enregistré dans la console (base de données)</text>
<text x="218" y="83.5" font-family="Inter Variable, Inter, system-ui, sans-serif" font-size="12.5" fill="#7D7B77" text-anchor="start">seulement les 11 réglages de la console</text>
