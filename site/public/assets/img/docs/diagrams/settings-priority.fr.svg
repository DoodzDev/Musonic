<text x="152" y="162" font-family="Inter Variable, Inter, system-ui, sans-serif" font-size="14" fill="#B1AFAB" text-anchor="middle" font-weight="600">3</text>
<text x="188" y="162.04" font-family="Inter Variable, Inter, system-ui, sans-serif" font-size="18" fill="#F1F0EE" text-anchor="start" font-weight="600">Variables d'environnement (MUSONIC_…)</text>
<rect x="150" y="28" width="600" height="80" rx="12" fill="#1C1C1E" stroke="#FF6B35" stroke-width="1.5"/>
