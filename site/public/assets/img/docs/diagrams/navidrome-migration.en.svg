<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 390" role="img" aria-labelledby="t d">
<title id="t">Moving from Navidrome</title>
<desc id="d">Navidrome, which keeps running until you switch, and Musonic Server, installed next to it, both read the same music folder: nothing is moved. To bring your data over: a copy of navidrome.db is read by the import-navidrome command, which brings playlists, likes, ratings and plays into Musonic; passwords are not imported.</desc>
<defs><marker id="ahg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0.8 L10 5 L0 9.2 Z" fill="#7D7B77"/></marker><marker id="aho" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0.8 L10 5 L0 9.2 Z" fill="#FF6B35"/></marker><marker id="asg" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M10 0.8 L0 5 L10 9.2 Z" fill="#7D7B77"/></marker><marker id="aso" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M10 0.8 L0 5 L10 9.2 Z" fill="#FF6B35"/></marker></defs>
<rect x="20" y="20" width="250" height="110" rx="12" fill="#1C1C1E" stroke="#3A3A3D" stroke-width="1.5"/>
<text x="145" y="61.04" font-family="Inter Variable, Inter, system-ui, sans-serif" font-size="18" fill="#F1F0EE" text-anchor="middle" font-weight="600">Navidrome</text>
<text x="145" y="81.92" font-family="Inter Variable, Inter, system-ui, sans-serif" font-size="14" fill="#B1AFAB" text-anchor="middle"><tspan x="145" dy="0">keeps running until you</tspan><tspan x="145" dy="18">switch</tspan></text>
<rect x="690" y="20" width="250" height="110" rx="12" fill="#1C1C1E" stroke="#FF6B35" stroke-width="1.5"/>
<text x="815" y="70.04" font-family="Inter Variable, Inter, system-ui, sans-serif" font-size="18" fill="#F1F0EE" text-anchor="middle" font-weight="600">Musonic Server</text>
<text x="815" y="90.92" font-family="Inter Variable, Inter, system-ui, sans-serif" font-size="14" fill="#B1AFAB" text-anchor="middle">installed next to it</text>
<rect x="355" y="20" width="250" height="110" rx="12" fill="#1C1C1E" stroke="#3A3A3D" stroke-width="1.5"/>
<g transform="translate(466 42) scale(1.16667)" fill="none" stroke="#B1AFAB" stroke-width="1.28571" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6.5a1.5 1.5 0 0 1 1.5-1.5h4.2l2 2.2h8.8A1.5 1.5 0 0 1 21 8.7v9.8a1.5 1.5 0 0 1-1.5 1.5h-15A1.5 1.5 0 0 1 3 18.5z"/></g>
<text x="480" y="102" font-family="Inter Variable, Inter, system-ui, sans-serif" font-size="17" fill="#F1F0EE" text-anchor="middle" font-weight="600">Music folder</text>
<path d="M355 75 L276 75" fill="none" stroke="#7D7B77" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#ahg)"/>
<path d="M605 75 L684 75" fill="none" stroke="#7D7B77" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#ahg)"/>
<text x="480" y="158" font-family="Inter Variable, Inter, system-ui, sans-serif" font-size="13.5" fill="#B1AFAB" text-anchor="middle">Both read the same folder, nothing is moved</text>
<text x="20" y="214" font-family="Inter Variable, Inter, system-ui, sans-serif" font-size="14" fill="#F1F0EE" text-anchor="start" font-weight="600">Bringing your data over</text>
<rect x="20" y="232" width="270" height="136" rx="12" fill="#1C1C1E" stroke="#3A3A3D" stroke-width="1.5"/>
<text x="38" y="268" font-family="JetBrains Mono, ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" fill="#F1F0EE" text-anchor="start" font-weight="600">navidrome-copy.db</text>
<text x="38" y="292" font-family="Inter Variable, Inter, system-ui, sans-serif" font-size="13" fill="#B1AFAB" text-anchor="start"><tspan x="38" dy="0">a safe copy of navidrome.db; the</tspan><tspan x="38" dy="17">original is never changed</tspan></text>
<path d="M298 300 L337 300" fill="none" stroke="#7D7B77" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#ahg)"/>
<rect x="345" y="232" width="270" height="136" rx="12" fill="#1C1C1E" stroke="#3A3A3D" stroke-width="1.5"/>
<text x="363" y="268" font-family="JetBrains Mono, ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" fill="#F1F0EE" text-anchor="start" font-weight="600">import-navidrome</text>
<text x="363" y="292" font-family="Inter Variable, Inter, system-ui, sans-serif" font-size="13" fill="#B1AFAB" text-anchor="start"><tspan x="363" dy="0">Musonic's command reads the</tspan><tspan x="363" dy="17">copy, for accounts with the same</tspan><tspan x="363" dy="17">user name</tspan></text>
<path d="M623 300 L662 300" fill="none" stroke="#7D7B77" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#ahg)"/>
<rect x="670" y="232" width="270" height="136" rx="12" fill="#1C1C1E" stroke="#3A3A3D" stroke-width="1.5"/>
<text x="688" y="268" font-family="Inter Variable, Inter, system-ui, sans-serif" font-size="17" fill="#F1F0EE" text-anchor="start" font-weight="600">In Musonic</text>
<text x="688" y="292" font-family="Inter Variable, Inter, system-ui, sans-serif" font-size="13" fill="#B1AFAB" text-anchor="start"><tspan x="688" dy="0">playlists, likes, ratings and</tspan><tspan x="688" dy="17">plays</tspan></text>
<text x="688" y="331" font-family="Inter Variable, Inter, system-ui, sans-serif" font-size="12.5" fill="#7D7B77" text-anchor="start">Passwords are not imported.</text>
</svg>
