<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 450" role="img" aria-labelledby="t d">
<title id="t">Who uses which part of the API</title>
<desc id="d">Musonic Server answers on /rest (Subsonic and OpenSubsonic), /v1 (the Musonic API), /v1/events (real-time events over WebSocket) and /health (liveness check). The Musonic apps (Android, Musonic Web) use /rest, /v1 and /v1/events; other Subsonic apps use /rest; the admin console uses the /v1 routes; scripts and health checks can use /rest, /v1 and /health. The server also serves the console at / and Musonic Web at /app/.</desc>
