<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 250" role="img" aria-labelledby="t d">
<title id="t">Where settings come from</title>
<desc id="d">When the server starts, the default is replaced by the configuration file, which is replaced by the environment variables, which are replaced by the value saved in the console. A value saved in the console wins, even over compose.yml.</desc>
<defs><marker id="ahg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0.8 L10 5 L0 9.2 Z" fill="#7D7B77"/></marker><marker id="aho" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0.8 L10 5 L0 9.2 Z" fill="#FF6B35"/></marker><marker id="asg" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M10 0.8 L0 5 L10 9.2 Z" fill="#7D7B77"/></marker><marker id="aso" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M10 0.8 L0 5 L10 9.2 Z" fill="#FF6B35"/></marker></defs>
<text x="20" y="32" font-family="Inter Variable, Inter, system-ui, sans-serif" font-size="14" fill="#B1AFAB" text-anchor="start">When the server starts, each source replaces the one before:</text>
<rect x="20" y="52" width="160" height="150" rx="12" fill="#1C1C1E" stroke="#3A3A3D" stroke-width="1.5"/>
<text x="36" y="86" font-family="Inter Variable, Inter, system-ui, sans-serif" font-size="15" fill="#F1F0EE" text-anchor="start" font-weight="600">Default</text>
<text x="36" y="108" font-family="Inter Variable, Inter, system-ui, sans-serif" font-size="12.5" fill="#7D7B77" text-anchor="start"><tspan x="36" dy="0">built into the</tspan><tspan x="36" dy="16">server</tspan></text>
<path d="M186 127 L254 127" fill="none" stroke="#7D7B77" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#ahg)"/>
<text x="220" y="117" font-family="Inter Variable, Inter, system-ui, sans-serif" font-size="11.5" fill="#7D7B77" text-anchor="middle">replaced by</text>
<rect x="260" y="52" width="160" height="150" rx="12" fill="#1C1C1E" stroke="#3A3A3D" stroke-width="1.5"/>
<text x="276" y="86" font-family="Inter Variable, Inter, system-ui, sans-serif" font-size="15" fill="#F1F0EE" text-anchor="start" font-weight="600"><tspan x="276" dy="0">Configuration</tspan><tspan x="276" dy="20">file</tspan></text>
<text x="276" y="130" font-family="JetBrains Mono, ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" fill="#B1AFAB" text-anchor="start">MUSONIC_CONFIG</text>
<text x="276" y="152" font-family="Inter Variable, Inter, system-ui, sans-serif" font-size="12.5" fill="#7D7B77" text-anchor="start">TOML, optional</text>
<path d="M426 127 L494 127" fill="none" stroke="#7D7B77" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#ahg)"/>
<text x="460" y="117" font-family="Inter Variable, Inter, system-ui, sans-serif" font-size="11.5" fill="#7D7B77" text-anchor="middle">replaced by</text>
<rect x="500" y="52" width="160" height="150" rx="12" fill="#1C1C1E" stroke="#3A3A3D" stroke-width="1.5"/>
<text x="516" y="86" font-family="Inter Variable, Inter, system-ui, sans-serif" font-size="15" fill="#F1F0EE" text-anchor="start" font-weight="600"><tspan x="516" dy="0">Environment</tspan><tspan x="516" dy="20">variables</tspan></text>
<text x="516" y="130" font-family="JetBrains Mono, ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" fill="#B1AFAB" text-anchor="start">MUSONIC_…</text>
<text x="516" y="152" font-family="Inter Variable, Inter, system-ui, sans-serif" font-size="12.5" fill="#7D7B77" text-anchor="start"><tspan x="516" dy="0">for example in</tspan><tspan x="516" dy="16">compose.yml</tspan></text>
<path d="M666 127 L734 127" fill="none" stroke="#7D7B77" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#ahg)"/>
<text x="700" y="117" font-family="Inter Variable, Inter, system-ui, sans-serif" font-size="11.5" fill="#7D7B77" text-anchor="middle">replaced by</text>
<rect x="740" y="52" width="200" height="150" rx="12" fill="#1C1C1E" stroke="#FF6B35" stroke-width="1.5"/>
<text x="756" y="86" font-family="Inter Variable, Inter, system-ui, sans-serif" font-size="15" fill="#F1F0EE" text-anchor="start" font-weight="600"><tspan x="756" dy="0">Value saved in the</tspan><tspan x="756" dy="20">console</tspan></text>
<text x="756" y="128" font-family="Inter Variable, Inter, system-ui, sans-serif" font-size="12.5" fill="#7D7B77" text-anchor="start"><tspan x="756" dy="0">for the settings the</tspan><tspan x="756" dy="16">console can change</tspan></text>
<text x="940" y="236" font-family="Inter Variable, Inter, system-ui, sans-serif" font-size="13.5" fill="#F1F0EE" text-anchor="end">A value saved in the console wins, even over compose.yml.</text>
</svg>
