name: Server CI

on:
  push:
    branches: [main]
    paths:
      - 'apps/server/**'
      - 'packages/core/src/server/**'
      - '.github/workflows/server-ci.yml'
  pull_request:
    paths:
      - 'apps/server/**'
      - 'packages/core/src/server/**'
      - '.github/workflows/server-ci.yml'

concurrency:
  group: server-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/server
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/server
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked
      # `cargo test` writes the TypeScript types of the native API (ADR-018): they must be
      # committed as generated.
      - name: TypeScript types are up to date
        run: |
          changes=$(git status --porcelain -- ../../packages/core/src/server/generated)
          if [ -n "$changes" ]; then echo "$changes"; echo "Run cargo test and commit the generated types."; exit 1; fi
