name: Web CI

on:
  pull_request:
    branches:
      - main
    paths:
      - 'apps/web/**'
      - 'apps/admin/**'
      - 'packages/core/**'
      - 'packages/icons/**'
      - 'apps/mobile/src/components/icons/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/ci-web.yml'
  push:
    branches:
      - main
    paths:
      - 'apps/web/**'
      - 'apps/admin/**'
      - 'packages/core/**'
      - 'packages/icons/**'
      - 'apps/mobile/src/components/icons/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/ci-web.yml'

jobs:
  check:
    name: Core Tests, Web & Console Lint & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Core type check
        run: npm run typecheck --workspace packages/core

      - name: Core tests
        run: npm run test:core

      - name: Web lint
        run: npm run lint --workspace apps/web

      - name: Web build
        run: npm run build --workspace apps/web

      - name: Icons generated from the mobile set are up to date
        run: |
          python3 packages/icons/scripts/generate.py
          git diff --exit-code -- packages/icons/src/icons.ts

      - name: Console lint
        run: npm run lint --workspace apps/admin

      - name: Console build
        run: npm run build --workspace apps/admin
