name: Server Release

# A `server-vX.Y.Z` tag builds Musonic Server (with ffmpeg and its console) for x86 and ARM,
# pushes the image ghcr.io/doodzdev/musonic-server (tags X.Y.Z, X.Y, X, latest) and publishes
# the release "Musonic Server X.Y.Z" with compose.yml and the program for each architecture
# (the console next to it), its notes taken from apps/server/CHANGELOG.md.
on:
  push:
    tags:
      - 'server-v*'

permissions:
  contents: write
  packages: write

env:
  IMAGE: ghcr.io/doodzdev/musonic-server

jobs:
  build:
    name: Build (${{ matrix.arch }})
    strategy:
      matrix:
        include:
          - arch: x86_64
            platform: linux/amd64
            runner: ubuntu-24.04
          - arch: aarch64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Sign in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/server/Dockerfile
          platforms: ${{ matrix.platform }}
          labels: |
            org.opencontainers.image.source=https://github.com/DoodzDev/Musonic
            org.opencontainers.image.title=Musonic Server
            org.opencontainers.image.licenses=PolyForm-Noncommercial-1.0.0
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=server-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=server-${{ matrix.arch }}

      - name: Keep the digest
        run: |
          mkdir -p digests
          touch "digests/${DIGEST#sha256:}"
        env:
          DIGEST: ${{ steps.build.outputs.digest }}

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.arch }}
          path: digests/*
          retention-days: 1

      # The same program and console as in the image, for installing without Docker.
      - name: Package the program
        run: |
          VERSION="${GITHUB_REF_NAME#server-v}"
          NAME="musonic-server-$VERSION-linux-${{ matrix.arch }}"
          docker pull "$IMAGE@${{ steps.build.outputs.digest }}"
          id=$(docker create "$IMAGE@${{ steps.build.outputs.digest }}")
          mkdir "$NAME"
          docker cp "$id:/usr/local/bin/musonic-server" "$NAME/musonic-server"
          docker cp "$id:/usr/share/musonic/admin" "$NAME/admin"
          docker rm "$id"
          cp apps/server/LICENSE apps/server/README.md apps/server/CHANGELOG.md "$NAME/"
          tar -czf "$NAME.tar.gz" "$NAME"

      - name: Upload program
        uses: actions/upload-artifact@v4
        with:
          name: program-${{ matrix.arch }}
          path: musonic-server-*.tar.gz
          retention-days: 7

  release:
    name: Publish Musonic Server
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          pattern: digest-*
          path: digests
          merge-multiple: true

      - name: Download programs
        uses: actions/download-artifact@v4
        with:
          pattern: program-*
          path: programs
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Sign in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag the image for both architectures
        working-directory: digests
        run: |
          VERSION="${GITHUB_REF_NAME#server-v}"
          MINOR="${VERSION%.*}"
          MAJOR="${VERSION%%.*}"
          docker buildx imagetools create \
            -t "$IMAGE:$VERSION" -t "$IMAGE:$MINOR" -t "$IMAGE:$MAJOR" -t "$IMAGE:latest" \
            $(printf "$IMAGE@sha256:%s " *)
          docker buildx imagetools inspect "$IMAGE:$VERSION"

      - name: Read version and notes
        run: |
          VERSION="${GITHUB_REF_NAME#server-v}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          # The section "## [X.Y.Z]" of the changelog, up to the next "## [".
          awk -v v="$VERSION" '
            index($0, "## [" v "]") == 1 { on = 1; next }
            on && /^## \[/ { exit }
            on { print }
          ' apps/server/CHANGELOG.md > release-notes.md
          test -s release-notes.md || echo "See apps/server/CHANGELOG.md." > release-notes.md
          cp apps/server/compose.example.yml compose.yml

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Musonic Server ${{ env.VERSION }}
          body_path: release-notes.md
          # "Latest" stays the mobile release: the site and README download links rely on it.
          make_latest: false
          files: |
            compose.yml
            programs/*.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
