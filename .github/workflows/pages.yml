name: Website & Web Client

# Publishes the GitHub Pages site: the project website and its documentation
# (site/, Astro + Starlight) at the root and the web client under /app/ (https://musonic.doodz.dev/app/, custom domain set in
# the repository settings → Pages).
on:
  push:
    branches:
      - main
    paths:
      - 'site/**'
      - 'apps/web/**'
      - 'packages/core/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build site and web client
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: |
          npm ci
          npm ci --prefix site

      - name: Build web client
        run: npm run build --workspace apps/web
        env:
          MUSONIC_WEB_BASE: /app/

      - name: Build website
        run: npm run build --prefix site

      - name: Assemble site
        # Website at the root, web client under /app/; the single 404 page of
        # GitHub Pages opens the web client for /app/… and the site's own page otherwise.
        run: bash site/scripts/assemble.sh _site

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
